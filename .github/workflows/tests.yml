name: tests

# Offline suites: every AWS and GitHub client is a fake, so this job needs no credentials.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install boto3==1.43.120
      - run: python tests/test_b1_b3.py
      - run: python tests/test_hardening.py
      - run: python tests/test_run_qa_switch.py

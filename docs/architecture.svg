<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5b8cff"/>
    </marker>
    <marker id="ah2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3a4577"/>
    </marker>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#9d5bff"/>
    </linearGradient>
    <style>
      .card { fill:#141b33; stroke:#26305a; stroke-width:1.5; rx:12; }
      .card2 { fill:#1b2444; stroke:#26305a; stroke-width:1.5; }
      .title { fill:#e7ecff; font-size:15px; font-weight:650; }
      .sub { fill:#8592c0; font-size:11px; }
      .tiny { fill:#8592c0; font-size:10px; }
      .grp { fill:none; stroke:#26305a; stroke-width:1.5; stroke-dasharray:4 4; }
      .grplabel { fill:#8592c0; font-size:11px; font-weight:600; letter-spacing:.08em; }
      .wire { stroke:#5b8cff; stroke-width:2.5; fill:none; stroke-dasharray:7 6; animation:dash 1.1s linear infinite; }
      .wire2 { stroke:#3a4577; stroke-width:2; fill:none; stroke-dasharray:6 5; animation:dash 1.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset:-13; } }
      .pulse { animation:pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.55; } 50% { opacity:1; } }
    </style>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1160" height="560" fill="#0b1020" rx="14"/>

  <!-- ── column 1: user ── -->
  <rect class="card" x="30" y="205" width="170" height="110" rx="12"/>
  <circle cx="70" cy="243" r="14" fill="none" stroke="#5b8cff" stroke-width="2.5"/>
  <path d="M48,285 C52,264 88,264 92,285" fill="none" stroke="#5b8cff" stroke-width="2.5"/>
  <text class="title" x="112" y="248">Admin</text>
  <text class="sub" x="112" y="266">browser</text>
  <text class="tiny" x="46" y="303">Cognito sign-in · 8h token</text>

  <!-- user -> apigw -->
  <path class="wire" d="M200,260 H262" marker-end="url(#ah)"/>

  <!-- ── column 2: edge ── -->
  <rect class="card" x="268" y="150" width="180" height="90" rx="12"/>
  <path d="M296,180 l14,-14 14,14 -14,14 Z" fill="none" stroke="#e17ec3" stroke-width="2.5"/>
  <text class="title" x="336" y="181">HTTP API</text>
  <text class="sub" x="336" y="199">Gateway</text>
  <text class="tiny" x="284" y="228">public HTTPS endpoint</text>

  <rect class="card" x="268" y="280" width="180" height="90" rx="12"/>
  <path d="M310,336 a17,17 0 1 1 1,-30 a13,13 0 0 1 24,6 a11,11 0 0 1 -4,24 Z" fill="none" stroke="#d95926" stroke-width="2.5"/>
  <text class="title" x="348" y="311">Cognito</text>
  <text class="sub" x="348" y="329">user pool</text>
  <text class="tiny" x="284" y="358">admin-only · validates writes</text>

  <!-- apigw -> lambda -->
  <path class="wire" d="M448,195 C490,195 495,240 530,252" marker-end="url(#ah)"/>
  <!-- lambda <-> cognito -->
  <path class="wire2" d="M448,325 C490,325 495,290 528,275" marker-end="url(#ah2)"/>

  <!-- ── column 3: the one lambda ── -->
  <rect class="card" x="535" y="185" width="220" height="150" rx="12"/>
  <path d="M566,215 l11,0 14,26 -14,26 -11,0 14,-26 Z" fill="#f5b342" opacity="0.9"/>
  <text class="title" x="600" y="230">Lambda</text>
  <text class="sub" x="600" y="248">agent-ops-console</text>
  <text class="tiny" x="551" y="285">one function · HTML + JSON API</text>
  <text class="tiny" x="551" y="301">4 tabs: pipeline · observability</text>
  <text class="tiny" x="551" y="317">evaluations · optimizations</text>

  <!-- async self-invoke loop -->
  <path class="wire2" d="M645,185 C625,150 685,150 665,182" marker-end="url(#ah2)"/>
  <text class="tiny" x="600" y="142">async self-invoke (fan-out · drafts)</text>

  <!-- ── column 4: backends group ── -->
  <rect class="grp" x="800" y="28" width="330" height="504" rx="14"/>
  <text class="grplabel" x="820" y="52">DATA SOURCES &amp; CONTROL</text>

  <!-- agentcore control -->
  <rect class="card2" x="820" y="66" width="290" height="64" rx="10"/>
  <rect x="836" y="82" width="30" height="30" rx="7" fill="url(#logo)" class="pulse"/>
  <text class="title" x="878" y="93" font-size="13">AgentCore control plane</text>
  <text class="tiny" x="878" y="110">harnesses · runtimes · eval configs</text>

  <!-- agentcore data -->
  <rect class="card2" x="820" y="142" width="290" height="64" rx="10"/>
  <rect x="836" y="158" width="30" height="30" rx="7" fill="url(#logo)" class="pulse"/>
  <text class="title" x="878" y="169" font-size="13">AgentCore data plane</text>
  <text class="tiny" x="878" y="186">invoke · batch evals · recommendations · insights</text>

  <!-- cloudwatch -->
  <rect class="card2" x="820" y="218" width="290" height="64" rx="10"/>
  <path d="M842,262 v-16 M854,262 v-24 M866,262 v-10" stroke="#e17ec3" stroke-width="4" stroke-linecap="round"/>
  <text class="title" x="878" y="245" font-size="13">CloudWatch</text>
  <text class="tiny" x="878" y="262">metrics · Logs Insights · eval scores · spans</text>

  <!-- s3 + github -->
  <rect class="card2" x="820" y="294" width="290" height="64" rx="10"/>
  <path d="M840,318 a12,7 0 0 1 24,0 v14 a12,7 0 0 1 -24,0 Z M840,318 a12,7 0 0 0 24,0" fill="none" stroke="#3ecf8e" stroke-width="2.2"/>
  <text class="title" x="878" y="321" font-size="13">S3 + GitHub API</text>
  <text class="tiny" x="878" y="338">QA reports · screenshots · workflow runs · PRs</text>

  <!-- dynamodb -->
  <rect class="card2" x="820" y="370" width="290" height="64" rx="10"/>
  <path d="M840,392 a12,6 0 0 1 24,0 m-24,0 v18 a12,6 0 0 0 24,0 v-18 m-24,9 a12,6 0 0 0 24,0" fill="none" stroke="#5b8cff" stroke-width="2.2"/>
  <text class="title" x="878" y="397" font-size="13">DynamoDB</text>
  <text class="tiny" x="878" y="414">fan-out state · drafted recommendations</text>

  <!-- bedrock -->
  <rect class="card2" x="820" y="446" width="290" height="64" rx="10"/>
  <circle cx="852" cy="478" r="13" fill="none" stroke="#9d5bff" stroke-width="2.2"/>
  <circle cx="852" cy="478" r="5" fill="#9d5bff" class="pulse"/>
  <text class="title" x="878" y="473" font-size="13">Bedrock (Claude)</text>
  <text class="tiny" x="878" y="490">drafts improved prompts from QA + eval data</text>

  <!-- lambda -> backends wires -->
  <path class="wire2" d="M755,235 C785,220 790,130 818,102" marker-end="url(#ah2)"/>
  <path class="wire2" d="M755,250 C785,240 790,195 818,178" marker-end="url(#ah2)"/>
  <path class="wire2" d="M755,262 C782,262 790,252 818,251" marker-end="url(#ah2)"/>
  <path class="wire2" d="M755,278 C785,285 790,318 818,325" marker-end="url(#ah2)"/>
  <path class="wire2" d="M755,292 C785,305 790,388 818,399" marker-end="url(#ah2)"/>
  <path class="wire2" d="M755,308 C788,325 790,462 818,475" marker-end="url(#ah2)"/>

  <!-- footer -->
  <text class="tiny" x="30" y="540">Serverless &amp; always-on — no servers to keep running. Reads are open; writes require a Cognito Bearer token validated server-side per request.</text>
</svg>
